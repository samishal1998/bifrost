name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and upload artifacts only (no GitHub release)
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: aarch64-apple-darwin, os: macos-14 }
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup target add "$TARGET"
          if [[ $TARGET == *-linux-musl ]]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
            # cc-rs looks for aarch64-linux-musl-gcc; Ubuntu's musl-tools only ships musl-gcc
            echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
          fi
      - name: Build
        run: cargo build --release --locked --target "$TARGET" -p bifrost-cli -p bifrost-daemon -p bifrost-tui
      - name: Package
        env:
          COPYFILE_DISABLE: 1 # keep macOS tar from adding ._ AppleDouble entries
        run: |
          d="bifrost-$TARGET"
          mkdir "$d"
          cp "target/$TARGET/release/"{bifrost,bifrostd,bifrost-tui} README.md LICENSE-MIT LICENSE-APACHE "$d/"
          tar -czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@v4
        with:
          name: bifrost-${{ matrix.target }}
          path: bifrost-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || !inputs.dry_run)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bifrost-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum bifrost-*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Bifröst $GITHUB_REF_NAME" --generate-notes dist/*
